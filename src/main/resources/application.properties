spring.application.name=spring-ai-demo-mcp-server

# Il client MCP usa 8080
server.port=8081
# Bind su 127.0.0.1: per uso da un'altra macchina cambiare in 0.0.0.0 (e aprire solo la porta necessaria nel firewall)
server.address=127.0.0.1


# Token Bearer richiesto su ogni richiesta (JWT ES256 firmato dal client, verificato con la chiave pubblica). Senza chiave pubblica tutte le richieste vengono rifiutate.
app.mcp.server.public-key-path=${MCP_SERVER_PUBLIC_KEY_PATH:}

spring.ai.mcp.server.name=spring-ai-demo-mcp-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.annotation-scanner.enabled=true
